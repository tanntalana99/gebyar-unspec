<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring Gebyar Unspec</title>
    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .zebra-even { background-color: #ffffff; }
        .zebra-odd { background-color: #f8fafc; }
        .zebra-even:hover, .zebra-odd:hover { background-color: #f1f5f9; }
    </style>
</head>
<body class="p-4 md:p-6">
    <div class="max-w-[95%] mx-auto space-y-6">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-red-600 to-rose-800 text-white rounded-xl p-6 shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <img src="https://lh3.googleusercontent.com/d/1jGWo55nUfNKfipDRCDRanY1qGzS9mI1m" alt="Logo" class="h-10 w-auto bg-white p-1 rounded-lg shadow-sm object-contain">
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold">Dashboard Monitoring Gebyar Unspec</h1>
                    <p class="text-red-100 text-sm mt-1">Detail Outstanding HI | POWERED BY SA GLADAG</p>
                </div>
            </div>
            <div class="flex flex-wrap gap-2 items-center">
                <div id="admin-actions" class="hidden flex flex-wrap gap-2">
                    <button onclick="clearAllData()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-lg shadow text-xs font-medium transition">
                        <i class="fa-solid fa-trash-can"></i> Reset Data
                    </button>
                    <button onclick="openModal()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-2 rounded-lg shadow text-xs font-medium transition">
                        <i class="fa-solid fa-file-upload"></i> Upload CSV
                    </button>
                </div>
                <div id="auth-button-container"></div>
            </div>
        </div>

        <!-- KPI Cards (Top 5 & Bottom 5 Sudah Dihapus) -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4">
                <div class="w-12 h-12 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center text-xl font-bold">
                    <i class="fa-solid fa-list-check"></i>
                </div>
                <div>
                    <div class="text-xs font-semibold text-slate-500 uppercase">Total Tiket</div>
                    <div id="stat-total" class="text-2xl font-bold text-slate-800">0</div>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4">
                <div class="w-12 h-12 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center text-xl font-bold">
                    <i class="fa-solid fa-clock"></i>
                </div>
                <div>
                    <div class="text-xs font-semibold text-slate-500 uppercase">Status Backend</div>
                    <div id="stat-backend" class="text-2xl font-bold text-slate-800">0</div>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4">
                <div class="w-12 h-12 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl font-bold">
                    <i class="fa-solid fa-map-location-dot"></i>
                </div>
                <div>
                    <div class="text-xs font-semibold text-slate-500 uppercase">Total Workzone</div>
                    <div id="stat-workzone" class="text-2xl font-bold text-slate-800">0</div>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4">
                <div class="w-12 h-12 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center text-xl font-bold">
                    <i class="fa-solid fa-microchip"></i>
                </div>
                <div>
                    <div class="text-xs font-semibold text-slate-500 uppercase">Total Device</div>
                    <div id="stat-device" class="text-2xl font-bold text-slate-800">0</div>
                </div>
            </div>
        </div>

        <!-- Filter Controls -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-slate-600 uppercase">Workzone:</label>
                    <select id="filter-workzone" onchange="renderTable()" class="px-3 py-2 border rounded-lg text-sm bg-white font-medium text-slate-700">
                        <option value="ALL">-- SEMUA WORKZONE --</option>
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-slate-600 uppercase">Status:</label>
                    <select id="filter-status" onchange="renderTable()" class="px-3 py-2 border rounded-lg text-sm bg-white font-medium text-slate-700">
                        <option value="ALL">-- SEMUA STATUS --</option>
                    </select>
                </div>
                <div class="relative w-full md:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
                    <input type="text" id="search-input" oninput="renderTable()" placeholder="Cari Incident, Service ID, SN..." class="w-full pl-10 pr-4 py-2 border rounded-lg text-sm">
                </div>
            </div>
        </div>

        <!-- Tabel Data 15 Kolom -->
        <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-slate-700 text-white font-semibold text-center uppercase tracking-wider">
                            <th class="p-2.5">No</th>
                            <th class="p-2.5 min-w-[110px]">Incident</th>
                            <th class="p-2.5 min-w-[220px]">Summary</th>
                            <th class="p-2.5 min-w-[120px]">Reported Date</th>
                            <th class="p-2.5">Workzone</th>
                            <th class="p-2.5">Status</th>
                            <th class="p-2.5 min-w-[120px]">Status Date</th>
                            <th class="p-2.5 min-w-[110px]">Service ID</th>
                            <th class="p-2.5 min-w-[110px]">Service No</th>
                            <th class="p-2.5">ONU RX</th>
                            <th class="p-2.5 min-w-[180px]">Device</th>
                            <th class="p-2.5 min-w-[140px]">SN ONT</th>
                            <th class="p-2.5 min-w-[130px]">RK Information</th>
                            <th class="p-2.5 min-w-[110px]">UKUR</th>
                            <th class="p-2.5">STATUS</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Script Supabase & Logika Parser -->
    <script>
        const SUPABASE_URL = "https://jptzwnpngoqdytblpuso.supabase.co/rest/v1/gebyar_unspec";
        const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

        let rawData = [];

        async function loadDataFromSupabase() {
            try {
                const response = await fetch(`${SUPABASE_URL}?select=*`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                if(response.ok) {
                    rawData = await response.json();
                    populateFilters();
                    renderTable();
                }
            } catch(e) { console.error(e); }
        }

        function populateFilters() {
            const wzSelect = document.getElementById('filter-workzone');
            const stSelect = document.getElementById('filter-status');
            const workzones = [...new Set(rawData.map(d => d.workzone).filter(Boolean))];
            const statuses = [...new Set(rawData.map(d => d.status).filter(Boolean))];

            wzSelect.innerHTML = '<option value="ALL">-- SEMUA WORKZONE --</option>' + workzones.map(w => `<option value="${w}">${w}</option>`).join('');
            stSelect.innerHTML = '<option value="ALL">-- SEMUA STATUS --</option>' + statuses.map(s => `<option value="${s}">${s}</option>`).join('');
        }

        function renderTable() {
            const wz = document.getElementById('filter-workzone').value;
            const st = document.getElementById('filter-status').value;
            const search = document.getElementById('search-input').value.toLowerCase();

            const filtered = rawData.filter(d => {
                const matchWz = wz === 'ALL' || d.workzone === wz;
                const matchSt = st === 'ALL' || d.status === st;
                const matchSearch = !search || 
                    (d.incident && d.incident.toLowerCase().includes(search)) ||
                    (d.service_id && d.service_id.toLowerCase().includes(search)) ||
                    (d.sn_ont && d.sn_ont.toLowerCase().includes(search));
                return matchWz && matchSt && matchSearch;
            });

            // Update Cards
            document.getElementById('stat-total').innerText = filtered.length;
            document.getElementById('stat-backend').innerText = filtered.filter(d => d.status === 'BACKEND').length;
            document.getElementById('stat-workzone').innerText = [...new Set(filtered.map(d => d.workzone))].length;
            document.getElementById('stat-device').innerText = [...new Set(filtered.map(d => d.device))].length;

            // Render Rows
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = filtered.map((d, i) => `
                <tr class="${i % 2 === 0 ? 'zebra-even' : 'zebra-odd'} border-b text-center">
                    <td class="p-2">${d.no || (i + 1)}</td>
                    <td class="p-2 font-semibold text-blue-600">${d.incident || '-'}</td>
                    <td class="p-2 text-left">${d.summary || '-'}</td>
                    <td class="p-2">${d.reported_date || '-'}</td>
                    <td class="p-2 font-medium">${d.workzone || '-'}</td>
                    <td class="p-2"><span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded">${d.status || '-'}</span></td>
                    <td class="p-2">${d.status_date || '-'}</td>
                    <td class="p-2">${d.service_id || '-'}</td>
                    <td class="p-2">${d.service_no || '-'}</td>
                    <td class="p-2">${d.onu_rx || '-'}</td>
                    <td class="p-2 text-left">${d.device || '-'}</td>
                    <td class="p-2 font-mono">${d.sn_ont || '-'}</td>
                    <td class="p-2">${d.rk_information || '-'}</td>
                    <td class="p-2">${d.ukur || '-'}</td>
                    <td class="p-2">${d.status_final || '-'}</td>
                </tr>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', loadDataFromSupabase);
    </script>
</body>
</html>
